<!DOCTYPE html>
<html lang="en-AU">
<head>

<title>Keyboard Shortcuts: Checking for Understanding</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    @keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

    /* key caps in text */
    kbd { display: inline-block; font-family: inherit; font-size: .8em; font-weight: 700; line-height: 1.15; color: var(--navy); background: #fff; border: 2px solid var(--navy); border-bottom-width: 4px;
        border-radius: 6px; padding: .06em .42em .02em; white-space: nowrap; vertical-align: .08em; }
    kbd svg { display: inline-block; vertical-align: -.06em; margin-right: .28em; }
    .kc { white-space: nowrap; }
    .kc i { font-style: normal; font-weight: 700; margin: 0 .18em; }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .body.top { align-items: stretch; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }
    svg { overflow: visible; display: block; }

    /* keyboard */
    .kbd { overflow: hidden; }
    .kl { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; fill: var(--navy); }
    .bn { font-family: var(--cond); font-size: 34px; font-weight: 900; fill: #fff; }
    .dock { position: relative; flex-shrink: 0; }
    .kwrap { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; background: #e3e6ee; }
    .replay { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; z-index: 3; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }
    .replay[hidden] { display: none; }
    .scene .replay { top: auto; bottom: 10px; }

    /* steps */
    .steps { display: flex; flex-direction: column; gap: 8px; }
    .steps.row { flex-direction: row; gap: 22px; }
    .steps.row .step { white-space: nowrap; }
    .step { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 600; color: #a3a8bc; transition: color .25s; }
    .step .n { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #c3c6d0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        font-family: var(--cond); font-size: 19px; font-weight: 900; color: #a3a8bc; transition: background-color .25s, border-color .25s, color .25s; }
    .step kbd { color: #a3a8bc; border-color: #c3c6d0; transition: color .25s, border-color .25s; }
    .step.now { color: var(--navy); }
    .step.now .n { border-color: var(--pink); color: var(--pink); }
    .step.now kbd, .step.done kbd { color: var(--navy); border-color: var(--navy); }
    .step.done { color: var(--navy); }
    .step.done .n { background: var(--pink); border-color: var(--pink); color: #fff; }

    /* panels and text boxes */
    .row3 { justify-content: space-between; align-items: stretch; gap: 26px; }
    .panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .ph { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mid-grey); }
    .tbox { flex: 1; font-family: inherit; font-size: 22px; font-weight: 500; line-height: 1.4; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 12px 14px;
        resize: none; outline: none; -webkit-user-select: text; user-select: text; background: #fff; transition: border-color .2s, box-shadow .2s, background-color .2s; }
    .tbox:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.15); }
    .tbox::selection { background: #f9b9dc; color: var(--navy); }
    .tbox::placeholder { color: #b5b9c6; }
    .tbox.right, .pbox.right { border-color: var(--pink); border-style: solid; background: #fff5fa; }

    /* mock browser with find */
    .bro { position: relative; flex: 1; height: 100%; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; background: #fff; }
    .bbar { background: var(--blank); border-bottom: 2px solid #d7dae2; display: flex; align-items: center; gap: 12px; padding: 8px 12px; flex-shrink: 0; }
    .bnav { display: flex; gap: 10px; }
    .bnav svg { width: 18px; height: 18px; fill: none; stroke: #8b90a8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .burl { flex: 1; background: #fff; border: 2px solid #d7dae2; border-radius: 20px; padding: 3px 14px; font-size: 16px; font-weight: 500; color: #6b7090; }
    .bpage { flex: 1; overflow-y: auto; position: relative; padding: 18px 34px 30px; -webkit-user-select: text; user-select: text; }
    .doc h2 { font-size: 28px; font-weight: 800; margin: 0 0 4px; }
    .doc .sub { font-size: 17px; color: #6b7090; margin-bottom: 8px; }
    .doc h3 { font-size: 20px; font-weight: 800; margin: 18px 0 4px; color: var(--pink); }
    .doc p { font-size: 18px; line-height: 1.5; margin: 0 0 8px; }
    mark.hit { background: #fbd1e8; color: inherit; border-radius: 3px; padding: 0 1px; }
    mark.hit.on { background: var(--pink); color: #fff; }
    .fbar { position: absolute; right: 16px; top: 58px; background: #fff; border: 2px solid #c3c6d0; border-radius: 8px; box-shadow: 0 10px 24px rgba(27,31,69,.2);
        display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; animation: capIn .3s var(--ease); z-index: 4; }
    .fbar[hidden] { display: none; }
    .fbar input { width: 210px; font-family: inherit; font-size: 18px; font-weight: 600; color: var(--navy); border: 2px solid var(--pink); border-radius: 6px; padding: 4px 8px; outline: none; -webkit-user-select: text; user-select: text; }
    .fbar .fc { font-size: 16px; font-weight: 600; color: #6b7090; min-width: 52px; text-align: center; }
    .fbar button { width: 32px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 0; }
    .fbar button svg { width: 18px; height: 18px; fill: none; stroke: var(--navy); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .fbar button:hover { background: var(--blank); }
    .fcol { display: flex; flex-direction: column; justify-content: center; gap: 16px; width: 316px; flex-shrink: 0; }
    .ans { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
    .ain { width: 150px; font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 6px 10px; text-align: center; outline: none;
        -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s, color .2s; }
    .ain:focus { border-color: var(--pink); }
    .ain.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .ain.wrong { border-style: dashed; animation: shake .4s; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .wl { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: var(--navy); }
    .wl.w { fill: #fff; }

    /* snip */
    .snipcard { flex: 1; border: 3px solid var(--navy); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--blank); }
    .pbox { flex: 1; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 14px; cursor: pointer; outline: none; overflow: hidden;
        transition: border-color .2s, background-color .2s, box-shadow .2s; text-align: center; font-size: 21px; font-weight: 600; color: #8b90a8; line-height: 1.5; }
    .pbox:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.15); color: var(--navy); }
    .pbox img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; animation: popIn .45s var(--ease); }

    /* file explorer */
    .fxw { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .fx { border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; height: 300px; background: #fff; outline: none; cursor: default; transition: border-color .2s, box-shadow .2s; }
    .fx:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.15); outline: none; }
    .fxh { background: var(--blank); padding: 7px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; border-bottom: 2px solid #d7dae2; }
    .fxh svg { width: 26px; height: 22px; flex-shrink: 0; }
    .fxh svg.wc { margin-left: auto; width: 58px; height: 13px; }
    .fxp { font-size: 14px; font-weight: 500; color: #6b7090; padding: 5px 12px; border-bottom: 1px solid #e6e8ef; }
    .fxg { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 6px 8px; align-content: start; }
    .file { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 2px 3px; border-radius: 6px; border: 2px solid transparent; font-size: 14px; font-weight: 600; }
    .file.sel { background: var(--tint); border-color: #8f98c8; }
    .file.new { animation: popIn .4s var(--ease) both; }
    .file svg { width: 76px; height: 54px; border-radius: 4px; }
    .fxempty { grid-column: 1 / -1; color: #a3a8bc; text-align: center; margin-top: 66px; font-size: 18px; font-weight: 600; }
    .fxs { font-size: 14px; font-weight: 600; color: #6b7090; padding: 5px 12px; border-top: 1px solid #e6e8ef; min-height: 29px; }

    /* quick fire */
    .qf { flex: 1; height: 100%; border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .qfh { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .qfh .rd { display: flex; gap: 8px; margin-left: auto; }
    .qfh .rd span { width: 22px; height: 22px; border-radius: 4px; border: 3px solid #fff; transition: background-color .25s, border-color .25s; }
    .qfh .rd span.y { background: var(--pink); border-color: var(--pink); }
    .qfb { flex: 1; display: flex; align-items: center; gap: 24px; padding: 14px 22px; }
    .qft { flex: 1; font-size: 30px; font-weight: 700; line-height: 1.3; }
    .qft.in { animation: capIn .45s var(--ease); }
    .qf.wrong { animation: shake .4s; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opts.col .opt { font-size: inherit; min-height: 74px; }
    .opts.g2 { grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opts.g2 .opt { min-height: 104px; font-size: 28px; font-weight: 700; padding: 16px 24px; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }

    /* picture choices */
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 8px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; z-index: 2; }
    .pcard .cap { font-size: 21px; font-weight: 700; line-height: 1.2; text-align: center; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }
    .swbg { background: #2a2f5c; border-radius: 12px; padding: 22px; width: 100%; }
    .swbg .pcard { border-color: #fff; padding-top: 56px; }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .col { display: flex; flex-direction: column; }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sm { font-size: 21px; padding: 6px 12px; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.right kbd { border-color: #fff; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }
    .pool.col1 { flex-direction: column; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 10px; }
    .slot { height: 50px; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: flex-start; padding: 0 3px; transition: border-color .2s, background-color .2s; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .slot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled { border-color: transparent; background: none; }
    .slot.wrong { animation: shake .4s; }
    .slot .tile { box-shadow: none; padding: 4px 14px; }
    .lrow { display: flex; align-items: center; gap: 12px; }
    .lrow .num { width: 40px; height: 40px; border-radius: 50%; background: var(--pink); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .lrow .slot { flex: 1; }
    .lrow .num.nv { background: var(--navy); }


    /* watch demo button */
    .wdemo { margin-left: auto; display: flex; align-items: center; gap: 7px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        color: var(--pink); background: #fff; border: 3px solid var(--pink); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .wdemo svg { width: 17px; height: 17px; fill: currentColor; }
    .wdemo:hover { background: #fff5fa; }
    .wdemo + .sctag { margin-left: 0; }

    /* demo window */
    .modal { position: absolute; inset: 0; z-index: 50; background: rgba(27,31,69,.62); display: flex; align-items: center; justify-content: center; animation: fadeIn .3s; transition: opacity .25s; }
    .modal[hidden] { display: none; }
    .modal.out { opacity: 0; }
    @keyframes fadeIn { from { opacity: 0; } }
    .mbox { width: 1010px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.35); animation: popIn .35s var(--ease); display: flex; flex-direction: column; }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const NS = 'http://www.w3.org/2000/svg', PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', LT = '#f0f3f6', U = 100;
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }

/* ---------- per-question listeners (removed on every new question) ---------- */
let offs = [];
function listen(t, ev, fn, opt) { t.addEventListener(ev, fn, opt); offs.push(() => t.removeEventListener(ev, fn, opt)); }
function cleanup() { offs.forEach(f => f()); offs = []; liveKbs = []; }
const KB = (() => {
    const m = {};
    const add = (row, y, h) => { let x = 0; row.forEach(([c, l, w = 1]) => { m[c] = { c, l, x, y, w, h }; x += w; }); };
    add([['Escape', 'Esc', 1.5], ...[...Array(12)].map((_, i) => ['F' + (i + 1), 'F' + (i + 1)]), ['Delete', 'Del', 1.5]], 0, .62);
    add([['Backquote', '`'], ...'1234567890'.split('').map(d => ['Digit' + d, d]), ['Minus', '-'], ['Equal', '='], ['Backspace', 'Backspace', 2]], .62, 1);

    add([['ShiftLeft', 'Shift', 2.25], ...'ZXCVBNM'.split('').map(c => ['Key' + c, c]), ['Comma', ','], ['Period', '.'], ['Slash', '/'], ['ShiftRight', 'Shift', 2.75]], 3.62, 1);

})();

/* ---------- laptop keyboard ---------- */
const CROPS = { left: [-.6, -.6, 9.05, 6.75], deck: [-.6, -.6, 16.2, 6.75] };
const WINLOGO = (cx, cy, c) => [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([sx, sy]) => `<rect x="${cx + (sx < 0 ? -15 : 2)}" y="${cy + (sy < 0 ? -15 : 2)}" width="13" height="13" fill="${c}"/>`).join('');

    const [vx, vy, vw, vh] = CROPS[o.crop || 'left'], blank = new Set(o.blank || []);

        <rect x="${5 * U}" y="${6.55 * U}" width="${5 * U}" height="${3.4 * U}" rx="22" fill="#d9dce6"/>

        return `<text x="${cx}" y="${cy + fs * .36}" text-anchor="middle" class="kl" style="font-size:${fs}px">${txt.replace('&', '&amp;').replace('<', '&lt;')}</text>`;
    };
    Object.values(KB).forEach(k => {
        const x = k.x * U + 7, y = k.y * U + 6, w = k.w * U - 14, h = k.h * U - 19, cx = x + w / 2, cy = y + h / 2;
        const g = sel('g', { 'data-c': k.c });
        const lab = o.noLabels || blank.has(k.c) ? '' : labelSVG(k, cx, cy, k.l);
        g.innerHTML = `<rect x="${x}" y="${y + 7}" width="${w}" height="${h}" rx="11" fill="#a3a8bc"/><g class="kt"><rect class="kf" x="${x}" y="${y}" width="${w}" height="${h}" rx="11" fill="#fff" stroke-width="7"/><g class="lb">${lab}</g></g>`;
        kg.appendChild(g);
        keys[k.c] = { k, g, kt: g.querySelector('.kt'), kf: g.querySelector('.kf'), lb: g.querySelector('.lb'), cx, cy };
    });

    function paint(c) {
        const k = keys[c]; if (!k) return;
        const on = live.has(c) || demo.has(c), mk = marks.has(c);
        k.kt.setAttribute('transform', on ? 'translate(0 6)' : '');
        k.kf.setAttribute('fill', on ? PK : mk ? '#fde6f3' : '#fff');
        k.kf.setAttribute('stroke', mk && !on ? PK : 'none');
        k.lb.querySelectorAll('text,rect').forEach(n => n.setAttribute('fill', on ? '#fff' : mk ? PK : NV));
    }

        svg, keys,
        live(c, on) { if (c === 'MetaRight') c = 'MetaLeft'; if (!keys[c]) return; on ? live.add(c) : live.delete(c); paint(c); },
        clearLive() { [...live].forEach(c => { live.delete(c); paint(c); }); },
        demoKey(c, on) { on ? demo.add(c) : demo.delete(c); paint(c); },
        demoClear() { [...demo].forEach(c => { demo.delete(c); paint(c); }); },
        mark(codes) { [...marks].forEach(c => { marks.delete(c); paint(c); }); (codes || []).forEach(c => { marks.add(c); paint(c); }); },
        label(c, txt) { const k = keys[c]; k.lb.innerHTML = labelSVG(k.k, k.cx, k.cy, txt); paint(c); },

/* every keyboard on screen lights up the keys the student is pressing */
document.addEventListener('keydown', e => liveKbs.forEach(k => k.live(e.code, true)), true);
document.addEventListener('keyup', e => {
    liveKbs.forEach(k => { k.live(e.code, false); if (!e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) k.clearLive(); });

/* ---------- shortcuts ---------- */
const WINI = `<svg viewBox="0 0 16 16" width=".78em" height=".78em"><rect width="7.2" height="7.2" fill="currentColor"/><rect x="8.8" width="7.2" height="7.2" fill="currentColor"/><rect y="8.8" width="7.2" height="7.2" fill="currentColor"/><rect x="8.8" y="8.8" width="7.2" height="7.2" fill="currentColor"/></svg>`;
const K = (...ks) => `<span class="kc">${ks.map(k => k === 'Win' ? `<kbd>${WINI}Win</kbd>` : `<kbd>${k}</kbd>`).join('<i>+</i>')}</span>`;
const SHORT = {
    all: { k: K('Ctrl', 'A'), codes: ['ControlLeft', 'KeyA'] },
    copy: { k: K('Ctrl', 'C'), codes: ['ControlLeft', 'KeyC'] },
    paste: { k: K('Ctrl', 'V'), codes: ['ControlLeft', 'KeyV'] },
    find: { k: K('Ctrl', 'F'), codes: ['ControlLeft', 'KeyF'] },
    alttab: { k: K('Alt', 'Tab'), codes: ['AltLeft', 'Tab'] },
    snip: { k: K('Win', 'Shift', 'S'), codes: ['MetaLeft', 'ShiftLeft', 'KeyS'] }

const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>`;
function dock(o = {}) {

/* ---------- shared desktop picture for Alt + Tab ---------- */
function desktop(sv) {
    const POS = { browser: [150, 22, 1.22], doc: [24, 44, 1.02], files: [330, 60, .96] };
    let order = ['browser', 'doc', 'files'], sw = false, hl = 0;
    const draw = () => {
        let s = `<rect width="640" height="290" fill="#3a4073"/><circle cx="560" cy="40" r="120" fill="#454b80"/><circle cx="80" cy="260" r="90" fill="#454b80"/>`;
        order.slice().reverse().forEach(w => { const [x, y, k] = POS[w]; s += `<g transform="translate(${x} ${y}) scale(${k})">${winArt(w)}</g>`; });
        s += `<rect y="262" width="640" height="28" fill="#eef0f5"/>`;
        ['browser', 'doc', 'files'].forEach((w, i) => { const x = 278 + i * 34; s += `<rect x="${x}" y="268" width="18" height="16" rx="3" fill="${w === 'browser' ? PK : NV}"/>${order[0] === w ? `<rect x="${x + 3}" y="286" width="12" height="3" rx="1.5" fill="${PK}"/>` : ''}`; });
        if (sw) {
            s += `<rect width="640" height="290" fill="${NV}" opacity=".45"/><rect x="66" y="66" width="508" height="150" rx="14" fill="#2a2f5c" opacity=".96"/>`;
            order.forEach((w, i) => {
                const x = 90 + i * 160, y = 106;
                s += `<text class="wl w" x="${x}" y="${y - 12}">${WINNAME[w]}</text><g transform="translate(${x} ${y}) scale(.45)">${winArt(w)}</g>`;
                if (i === hl) s += `<rect x="${x - 10}" y="${y - 34}" width="155" height="130" rx="10" fill="none" stroke="${PK}" stroke-width="5"/>`;
            });
        }
        sv.innerHTML = s;
    };
    draw();
    return {
        tab() { if (!sw) { sw = true; hl = 1; } else hl = (hl + 1) % order.length; draw(); },
        letGo() { if (!sw) return; const pick = order[hl]; order = [pick, ...order.filter(w => w !== pick)]; sw = false; draw(); }
    };
}

            <text x="42" y="35" class="wl" style="font-size:17px;font-weight:600">volcano facts</text><line x1="160" y1="20" x2="160" y2="38" stroke="${PK}" stroke-width="2.5"/>
            <rect x="20" y="76" width="170" height="16" rx="3" fill="${PK}"/><g fill="#c3c6d0"><rect x="20" y="104" width="290" height="8" rx="4"/><rect x="20" y="120" width="270" height="8" rx="4"/><rect x="20" y="136" width="284" height="8" rx="4"/><rect x="20" y="152" width="200" height="8" rx="4"/></g>
            <rect x="20" y="178" width="130" height="100" rx="6" fill="${NV}"/><path d="M36 262 L72 206 L92 236 L106 220 L134 262Z" fill="${PK}"/>
            <g fill="#c3c6d0"><rect x="166" y="182" width="144" height="8" rx="4"/><rect x="166" y="198" width="130" height="8" rx="4"/><rect x="166" y="214" width="140" height="8" rx="4"/><rect x="166" y="230" width="110" height="8" rx="4"/></g></svg>`;
        const col = el('div', 'col'); col.style.flex = '1';
        const g = el('div', 'opts');
        const els = q.opts.map((o, i) => { const b = el('button', 'opt', `<span class="l">${L[i]}</span><span>${o.t}</span>`); g.appendChild(b); return b; });
        col.appendChild(g); body.append(side, col);
        return mcCore(els, q);
    },

    switcher(q, body) {
        const bg = el('div', 'swbg'), g = el('div', 'pgrid');
        const els = q.wins.map((w, i) => { const b = el('button', 'pcard', `<span class="l">${L[i]}</span>${thumb(w, 210)}<span class="cap">${WINNAME[w]}${i === 0 ? ' (open now)' : ''}</span>`); g.appendChild(b); return b; });
        bg.appendChild(g); body.appendChild(bg);
        return mcCore(els, q);
    },

    order(q, body) {
        const sc = el('div', 'scene oscene', orderScene());
        const col = el('div'); col.style.cssText = 'display:flex;flex-direction:column;gap:10px;width:330px';
        const pool = el('div', 'pool col1'); pool.style.cssText = 'width:290px;align-self:stretch';
        const zones = q.order.map((want, i) => {
            const row = el('div', 'lrow', `<span class="num nv">${i + 1}</span>`), s = el('div', 'slot'); s.tabIndex = 0; row.appendChild(s); col.appendChild(row);
            return { el: s, box: s, cap: 1, want, onPut: () => s.classList.add('filled'), onTake: () => s.classList.remove('filled') };
        });
        body.append(sc, col, pool);
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => { zones.forEach(z => z.el.classList.remove('wrong')); refresh(); });
        shuffle(q.tiles).forEach(([k, h]) => { const t = D.tile(h); t.classList.add('sm'); t.dataset.k = k; pool.appendChild(t); });
        return {
            instr: 'Drag the steps into order (or tap a step, then a number), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let bad = 0, hint = null;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'); if (!t) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.dataset.k === z.want) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); z.el.classList.add('wrong'); if (!hint) hint = q.hints[t.dataset.k]; }
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} steps need moving. ` : '') + hint } : { ok: true };
            },
            done() {
                const b = el('button', 'wdemo', `${playIcon}<span>Watch it happen</span>`);
                b.onclick = () => openDemo(DEMOS.order, null);
                content.querySelector('.qhead').insertBefore(b, content.querySelector('.sctag'));
                const id = runId; setTimeout(() => { if (id === runId) openDemo(DEMOS.order, null); }, 1800);
            }
        };
    }
};
function thumbX(type, extra) { return `<svg viewBox="-4 -4 308 208" width="250" height="169">${winArt(type)}${extra}</svg>`; }

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sel = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sel && !z.locked) put(sel, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text) {
        const t = el('span', 'tile', text);
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { put(t, pool); return; }
            if (sel === t) { deselect(); return; }
            deselect(); sel = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    fit(); refreshCount();
    const pos = Buckles.getPos();
    if (pos >= TOTAL) finish(); else { qi = Math.max(0, pos); render(); }
});
